name: Probe JSDI reachability
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://api.dopravniinfo.cz/RegionData.ashx?region=124 https://api-mov.dopravniinfo.cz/config/web https://www.nexisrail.cz/eurovelo/manifest.webmanifest; do
            curl -s -m 40 -o /dev/null -w "$u %{http_code} %{size_download}\n" "$u" || echo "$u failed"
          done
